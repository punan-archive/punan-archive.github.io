<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="gb2312">
  <title>路径错误 - ftp.ms-school.edu.cn</title>
  <link rel="stylesheet" href="/websites/maishan_school/ftp/ftp.css">
</head>
<body>
  <main class="ftp-shell">
    <header class="ftp-title"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3.5 9h9l2-3h14v19.5H3.5z" fill="#d99c2b" stroke="#875816"/><path d="M4.5 11h25l-2.8 14.5H3.5z" fill="#f3c84d" stroke="#9c6b19"/></svg><div><h1>盟杉中学旧资料交换</h1><p>ftp.ms-school.edu.cn</p></div></header>
    <div class="ftp-path" id="ftp-path"></div>
    <section class="ftp-message">
      <strong>无法打开此文件夹。</strong>
      <p id="message"></p>
      <pre id="response"></pre>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const identifier = params.get('identifier') || '';
    const kind = params.get('kind') || 'attachment';
    const messages = {
      archive: ['档号不是资料交换目录编号。', '550 Catalog record number is not an exchange directory.'],
      negative: ['原底片号不是资料交换目录编号。', '550 Original negative number is not an exchange directory.'],
      roll: ['底片卷号不是资料交换目录编号。', '550 Film roll number is not an exchange directory.'],
      attachment: ['未找到该影像附件目录。', '550 Exchange directory not found.'],
    };
    const selected = messages[kind] || messages.attachment;
    document.querySelector('#ftp-path').textContent = `ftp://ftp.ms-school.edu.cn/pub/photo/old/${identifier}/`;
    document.querySelector('#message').textContent = selected[0];
    document.querySelector('#response').textContent = `220 MS-SCHOOL Old File Service\n230 Guest access accepted.\nCWD /pub/photo/old/${identifier}/\n${selected[1]}`;
  </script>
  <script src="/bridge/punan-web-bridge.js"></script>
</body>
</html>
