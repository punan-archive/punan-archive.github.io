<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>访问统计说明</title>
  <style>
    body{max-width:720px;margin:48px auto;padding:0 24px;background:#f4f1e8;color:#24303a;font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif}
    h1{font-size:24px}.box{padding:18px 22px;border:1px solid #aab4bb;background:#fff}
    button{padding:7px 16px;border:1px solid #708090;background:#e8edf0;color:#182433;cursor:pointer}
    small{color:#687680}
  </style>
</head>
<body>
  <main class="box">
    <h1>访问统计说明</h1>
    <p>本站使用不含 Cookie 的匿名统计，用于了解整体访问与探索进度。不会记录您在镜像中输入或查看的内容。</p>
    <button id="toggle" type="button"></button>
    <p><small id="status"></small></p>
  </main>
  <script>
    const key='punan.analytics.optout.v1';
    const button=document.querySelector('#toggle');
    const status=document.querySelector('#status');
    function render(){
      const off=localStorage.getItem(key)==='1';
      button.textContent=off?'允许匿名统计':'退出匿名统计';
      status.textContent=off?'这台浏览器已退出统计。':'这台浏览器目前允许匿名统计。';
    }
    button.addEventListener('click',()=>{localStorage.setItem(key,localStorage.getItem(key)==='1'?'0':'1');render();});
    render();
  </script>
</body>
</html>
